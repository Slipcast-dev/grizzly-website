name: Ошибка сайта
description: Проблема с отображением, навигацией или загрузкой
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема и ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Не включайте секреты и персональные данные.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Браузер, версия и ОС
    validations:
      required: true
