name: Website bug (English)
description: Report a display, navigation, language or download problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include secrets or personal information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version, OS and selected site language
    validations:
      required: true
