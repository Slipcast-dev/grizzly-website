<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1210" viewBox="0 0 1280 1210" role="img" aria-labelledby="title desc"><title id="title">Деталь макета: подсветка синтаксиса</title><desc id="desc">Демонстрация Python в цветах Xcode, восемь семейств языков и пример блока Markdown. Визуальный макет, не опубликованная страница.</desc><rect width="1280" height="1210" fill="#101213"/><g font-family="Arial, Helvetica, sans-serif"><text x="72" y="42" font-size="11" fill="#91a295" font-weight="500" letter-spacing="1.4">GRIZZLY 1.1.0 · ФРАГМЕНТ МАКЕТА · НА СОГЛАСОВАНИЕ</text><rect x="72" y="95" width="1136" height="557" rx="12" fill="#191c1e" stroke="#454e47"/><path d="M72 135h1136" stroke="#354038"/><circle cx="92" cy="116" r="4.5" fill="#ec736b"/><circle cx="107" cy="116" r="4.5" fill="#e3bb61"/><circle cx="122" cy="116" r="4.5" fill="#83b58a"/><text x="640" y="120" font-size="11" fill="#a9b0aa" font-weight="400" text-anchor="middle">Grizzly</text><path d="M274 135v517" stroke="#303832"/><text x="92" y="171" font-size="10" fill="#7d8d81" font-weight="500" letter-spacing="1.6">БИБЛИОТЕКА</text><text x="94" y="204" font-size="12" fill="#a3b0a5" font-weight="400" >Все файлы</text><text x="94" y="233" font-size="12" fill="#a3b0a5" font-weight="400" >Недавние</text><text x="94" y="262" font-size="12" fill="#a3b0a5" font-weight="400" >Избранное</text><text x="92" y="322" font-size="9" fill="#7d8d81" font-weight="500" letter-spacing="1.3">МОИ ДОКУМЕНТЫ</text><text x="96" y="355" font-size="12" fill="#a3b0a5" font-weight="400" >notes.md</text><rect x="82" y="365" width="181" height="29" rx="4" fill="#24382e" stroke="none"/><text x="96" y="386" font-size="12" fill="#b9deca" font-weight="400" >example.py</text><text x="96" y="417" font-size="12" fill="#a3b0a5" font-weight="400" >component.tsx</text><text x="96" y="448" font-size="12" fill="#a3b0a5" font-weight="400" >styles.scss</text><text x="96" y="479" font-size="12" fill="#a3b0a5" font-weight="400" >config.json</text><circle cx="94" cy="629" r="3" fill="#86c9b2"/><text x="106" y="633" font-size="10" fill="#819386" font-weight="400" >Локально. Только у вас.</text><path d="M274 179h934" stroke="#354038"/><text x="296" y="163" font-size="12" fill="#b7c5b8" font-weight="400" >example.py</text><rect x="632" y="142" width="238" height="29" rx="5" fill="#121714" stroke="none"/><rect x="711" y="145" width="80" height="23" rx="4" fill="#30483a" stroke="none"/><text x="672" y="161" font-size="10" fill="#8e9e92" font-weight="400" text-anchor="middle">Чтение</text><text x="751" y="161" font-size="10" fill="#cde7d5" font-weight="400" text-anchor="middle">Исходник</text><text x="830" y="161" font-size="10" fill="#8e9e92" font-weight="400" text-anchor="middle">Правка</text><text x="303" y="222" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">1</text><text x="334" y="222" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#E59F7B">&quot;&quot;&quot;Small demo for syntax highlighting.&quot;&quot;&quot;</tspan></text><text x="303" y="248" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">2</text><text x="334" y="248" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#FF7AB2">from </tspan><tspan fill="#D8D8D8">dataclasses </tspan><tspan fill="#FF7AB2">import </tspan><tspan fill="#D8D8D8">dataclass</tspan></text><text x="303" y="274" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">3</text><text x="334" y="274" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"></text><text x="303" y="300" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">4</text><text x="334" y="300" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#6CB6FF">@dataclass</tspan></text><text x="303" y="326" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">5</text><text x="334" y="326" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#FF7AB2">class </tspan><tspan fill="#6CB6FF">Task</tspan><tspan fill="#D8D8D8">:</tspan></text><text x="303" y="352" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">6</text><text x="334" y="352" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#D8D8D8">    title: str</tspan></text><text x="303" y="378" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">7</text><text x="334" y="378" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#D8D8D8">    done: bool = </tspan><tspan fill="#C9B6F5">False</tspan></text><text x="303" y="404" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">8</text><text x="334" y="404" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"></text><text x="303" y="430" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">9</text><text x="334" y="430" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#FF7AB2">def </tspan><tspan fill="#D8D8D8">summary(tasks: list[</tspan><tspan fill="#6CB6FF">Task</tspan><tspan fill="#D8D8D8">]) -&gt; str:</tspan></text><text x="303" y="456" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">10</text><text x="334" y="456" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#D8D8D8">    finished = sum(</tspan><tspan fill="#C9B6F5">1</tspan><tspan fill="#FF7AB2"> for </tspan><tspan fill="#D8D8D8">t </tspan><tspan fill="#FF7AB2">in </tspan><tspan fill="#D8D8D8">tasks </tspan><tspan fill="#FF7AB2">if </tspan><tspan fill="#D8D8D8">t.done)</tspan></text><text x="303" y="482" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">11</text><text x="334" y="482" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#FF7AB2">    return </tspan><tspan fill="#E59F7B">f&quot;{finished}/{len(tasks)} done&quot;</tspan></text><text x="303" y="508" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">12</text><text x="334" y="508" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"></text><text x="303" y="534" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">13</text><text x="334" y="534" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#D8D8D8">tasks = [</tspan><tspan fill="#6CB6FF">Task</tspan><tspan fill="#E59F7B">(&quot;write docs&quot;, </tspan><tspan fill="#C9B6F5">True</tspan><tspan fill="#D8D8D8">)]</tspan></text><text x="303" y="560" font-size="12" fill="#5c6860" font-weight="400" text-anchor="end">14</text><text x="334" y="560" font-size="16" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#D8D8D8">print(summary(tasks))</tspan></text><path d="M274 617h934" stroke="#354038"/><text x="290" y="639" font-size="10" fill="#819386" font-weight="400" >Python · UTF-8</text><text x="1188" y="639" font-size="10" fill="#819386" font-weight="400" text-anchor="end">Иллюстрация интерфейса</text><text x="72" y="745" font-size="10" fill="#86c9b2" font-weight="500" letter-spacing="2">02 / ЯЗЫК КОДА</text><text x="72" y="798" font-size="40" fill="#eef0e9" font-weight="600" >Код, который</text><text x="72" y="848" font-size="40" fill="#eef0e9" font-weight="600" >легче читать.</text><text x="72" y="895" font-size="14" fill="#a2aea4" font-weight="400" >Подсветка ключевых слов, строк и комментариев.</text><text x="72" y="922" font-size="14" fill="#a2aea4" font-weight="400" >В исходных файлах и блоках Markdown.</text><text x="72" y="949" font-size="14" fill="#a2aea4" font-weight="400" >В режиме правки на macOS — на лету.</text><rect x="672" y="776" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="734" y="804" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">Python</text><rect x="808" y="776" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="870" y="804" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">Swift</text><rect x="944" y="776" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="1006" y="804" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">C / C++</text><rect x="1080" y="776" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="1142" y="804" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">C#</text><rect x="672" y="836" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="734" y="864" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">JS / JSX</text><rect x="808" y="836" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="870" y="864" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">TS / TSX</text><rect x="944" y="836" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="1006" y="864" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">CSS / SCSS</text><rect x="1080" y="836" width="124" height="45" rx="6" fill="#191e1b" stroke="#36453b"/><text x="1142" y="864" font-size="14" fill="#c5d9ca" font-weight="500" text-anchor="middle">PHP</text><text x="672" y="918" font-size="12" fill="#8d9c91" font-weight="400" >Также: JSON, YAML, INI / TOML, XML / HTML, TeX и логи.</text><text x="672" y="942" font-size="12" fill="#8d9c91" font-weight="400" >JSX, TSX и SCSS включены в соответствующие семейства.</text><rect x="72" y="999" width="1136" height="140" rx="10" fill="#171e19" stroke="#34433a"/><text x="96" y="1037" font-size="21" fill="#86c9b2" font-weight="600" >И внутри Markdown.</text><text x="96" y="1069" font-size="13" fill="#a2aea4" font-weight="400" >Укажите язык блока — Grizzly подсветит код.</text><text x="96" y="1093" font-size="13" fill="#a2aea4" font-weight="400" >Тот же синтаксис. Те же цвета выбранной темы.</text><rect x="672" y="1022" width="511" height="96" rx="6" fill="#111713" stroke="#2d3b32"/><text x="689" y="1048" font-size="12" fill="#7F8C98" font-weight="400" font-family="Menlo, Consolas, monospace">```python</text><text x="689" y="1076" font-size="14" font-family="Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#FF7AB2">def </tspan><tspan fill="#D8D8D8">greet(name):</tspan><tspan x="689" dy="24" fill="#FF7AB2">    return </tspan><tspan fill="#E59F7B">f"Hello, {name}"</tspan></text></g></svg>
