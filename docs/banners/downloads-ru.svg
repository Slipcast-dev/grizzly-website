<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">ОТ ЯЗЫКА ДО УСТАНОВЩИКА</title><desc id="desc">Выберите язык: Автовыбор или кнопка EN/RU. Укажите платформу: Apple Silicon · Intel · Windows. Скачайте с GitHub: Прямая ссылка на файл релиза. API недоступен? Проверенные прямые ссылки на установщики сохраняются.</desc><rect x="1" y="1" width="1198" height="208" rx="22" fill="#101213" stroke="#303933"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="42" font-size="12" fill="#9ba99d" font-weight="600" letter-spacing="2">ОТ ЯЗЫКА ДО УСТАНОВЩИКА</text><text x="36" y="91" font-size="17" fill="#86c9b2" font-weight="600" >01</text><text x="76" y="91" font-size="22" fill="#eef0e9" font-weight="600" >Выберите язык</text><text x="36" y="128" font-size="15" fill="#aebaae" font-weight="400" >Автовыбор или кнопка EN/RU</text><path d="M376 83h24m-6-5 6 5-6 5" fill="none" stroke="#647769" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="433" y="91" font-size="17" fill="#dec58a" font-weight="600" >02</text><text x="473" y="91" font-size="22" fill="#eef0e9" font-weight="600" >Укажите платформу</text><text x="433" y="128" font-size="15" fill="#aebaae" font-weight="400" >Apple Silicon · Intel · Windows</text><path d="M773 83h24m-6-5 6 5-6 5" fill="none" stroke="#647769" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="830" y="91" font-size="17" fill="#d98f77" font-weight="600" >03</text><text x="870" y="91" font-size="22" fill="#eef0e9" font-weight="600" >Скачайте с GitHub</text><text x="830" y="128" font-size="15" fill="#aebaae" font-weight="400" >Прямая ссылка на файл релиза</text><path d="M36 155h1128" stroke="#303a33"/><text x="36" y="186" font-size="14" fill="#8eaa97" font-weight="400" >API недоступен? Проверенные прямые ссылки на установщики сохраняются.</text></g></svg>
