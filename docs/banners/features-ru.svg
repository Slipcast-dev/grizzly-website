<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">ЧТО ЕСТЬ ВНУТРИ</title><desc id="desc">Два языка. Язык браузера при первом входе.. Одна кнопка для переключения. Прямые загрузки. Apple Silicon, Intel и Windows.. Ссылки на установщики в HTML. Просто и открыто. GitHub Pages. Лицензия MIT.. Без аккаунтов и отслеживания.</desc><rect x="1" y="1" width="1198" height="258" rx="22" fill="#101213" stroke="#303933"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="42" font-size="12" fill="#9ba99d" font-weight="600" letter-spacing="2">ЧТО ЕСТЬ ВНУТРИ</text><g transform="translate(36 75)" fill="none" stroke="#86c9b2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="12"/><ellipse cx="15" cy="15" rx="5.5" ry="12"/><path d="M3 15h24"/></g><text x="36" y="148" font-size="24" fill="#edf1e9" font-weight="600" >Два языка</text><text x="36" y="187" font-size="16" fill="#aebaae" font-weight="400" >Язык браузера при первом входе.</text><text x="36" y="215" font-size="16" fill="#aebaae" font-weight="400" >Одна кнопка для переключения.</text><path d="M408 70v157" stroke="#303a33"/><g transform="translate(430 75)" fill="none" stroke="#dec58a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2v17m-7-7 7 7 7-7M4 22v6h22v-6"/></g><text x="430" y="148" font-size="24" fill="#edf1e9" font-weight="600" >Прямые загрузки</text><text x="430" y="187" font-size="16" fill="#aebaae" font-weight="400" >Apple Silicon, Intel и Windows.</text><text x="430" y="215" font-size="16" fill="#aebaae" font-weight="400" >Ссылки на установщики в HTML.</text><path d="M802 70v157" stroke="#303a33"/><g transform="translate(824 75)" fill="none" stroke="#d98f77" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 2 11 4v8c0 7-5 11-11 15C9 25 4 21 4 14V6Z"/><path d="m10 15 4 4 7-8"/></g><text x="824" y="148" font-size="24" fill="#edf1e9" font-weight="600" >Просто и открыто</text><text x="824" y="187" font-size="16" fill="#aebaae" font-weight="400" >GitHub Pages. Лицензия MIT.</text><text x="824" y="215" font-size="16" fill="#aebaae" font-weight="400" >Без аккаунтов и отслеживания.</text></g></svg>
