<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">WHAT YOU WILL FIND</title><desc id="desc">Two languages. Browser language on first visit.. A single button to switch. Direct downloads. Apple Silicon, Intel and Windows.. Installer links ready in the HTML. Small. Open. Static.. GitHub Pages. MIT license.. No accounts or visitor tracking.</desc><rect x="1" y="1" width="1198" height="258" rx="22" fill="#101213" stroke="#303933"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="42" font-size="12" fill="#9ba99d" font-weight="600" letter-spacing="2">WHAT YOU WILL FIND</text><g transform="translate(36 75)" fill="none" stroke="#86c9b2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="12"/><ellipse cx="15" cy="15" rx="5.5" ry="12"/><path d="M3 15h24"/></g><text x="36" y="148" font-size="24" fill="#edf1e9" font-weight="600" >Two languages</text><text x="36" y="187" font-size="16" fill="#aebaae" font-weight="400" >Browser language on first visit.</text><text x="36" y="215" font-size="16" fill="#aebaae" font-weight="400" >A single button to switch.</text><path d="M408 70v157" stroke="#303a33"/><g transform="translate(430 75)" fill="none" stroke="#dec58a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2v17m-7-7 7 7 7-7M4 22v6h22v-6"/></g><text x="430" y="148" font-size="24" fill="#edf1e9" font-weight="600" >Direct downloads</text><text x="430" y="187" font-size="16" fill="#aebaae" font-weight="400" >Apple Silicon, Intel and Windows.</text><text x="430" y="215" font-size="16" fill="#aebaae" font-weight="400" >Installer links ready in the HTML.</text><path d="M802 70v157" stroke="#303a33"/><g transform="translate(824 75)" fill="none" stroke="#d98f77" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 2 11 4v8c0 7-5 11-11 15C9 25 4 21 4 14V6Z"/><path d="m10 15 4 4 7-8"/></g><text x="824" y="148" font-size="24" fill="#edf1e9" font-weight="600" >Small. Open. Static.</text><text x="824" y="187" font-size="16" fill="#aebaae" font-weight="400" >GitHub Pages. MIT license.</text><text x="824" y="215" font-size="16" fill="#aebaae" font-weight="400" >No accounts or visitor tracking.</text></g></svg>
